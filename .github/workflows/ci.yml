name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Smoke test L1
        run: |
          .\.venv\Scripts\python.exe -m py_compile src/agi_kit/reflect.py

      - name: Smoke test L2
        run: |
          .\.venv\Scripts\python.exe -m py_compile src/agi_kit/playbook.py
          .\.venv\Scripts\python.exe -m py_compile src/agi_kit/meta.py

      - name: Smoke test L3
        run: |
          .\.venv\Scripts\python.exe -m py_compile src/agi_kit/loop.py

      - name: Smoke test L4
        run: |
          .\.venv\Scripts\python.exe -m py_compile src/agi_kit/recursive.py

      - name: Build PDFs
        run: |
          .\.venv\Scripts\python.exe scripts/make_figures.py
          .\.venv\Scripts\python.exe scripts/build_papers_pdf_en.py
          .\.venv\Scripts\python.exe scripts/make_docx.py

      - name: Submission artifact preflight
        run: .\.venv\Scripts\python.exe scripts/preflight_submission.py --allow-dirty --allow-placeholders

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: submission-artifacts
          path: |
            papers/*_en.pdf
            papers/docx/preprint_unified_en.docx

  secret-scan:
    # .gitleaks.toml and .pre-commit-config.yaml are present, but a pre-commit
    # hook is opt-in, missing from a fresh clone (.git/hooks holds only *.sample),
    # bypassable with `git commit --no-verify`, and only ever inspects staged
    # content -- never history. Nothing in CI looked at secrets, so a committed
    # key would have left every other check green.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - name: gitleaks (full history, CLI)
        # The gitleaks-action v2 was here first and turned every Dependabot pull
        # request red with "GITHUB_TOKEN is now required to scan pull requests" --
        # a failure caused by the action's requirements, not by the repository.
        # Dependabot runs the workflow from its own branch, so fixing it on main
        # does not help until the PR is regenerated. The CLI needs no token, scans
        # the same checked-out history, and has one fewer moving part.
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
